services:
  # 1. MT5 WINE BRIDGE (Reverted to your working gmag11 image)
  mt5_bridge:
    image: gmag11/metatrader5_vnc:latest
    container_name: quant_trading_mt5_bridge_local
    restart: always
    ports:
      - "3000:3000"
    environment:
      - CUSTOM_USER=admin
      - PASSWORD=secure_vnc_telemetry_pass
      - TZ=Europe/London
    volumes:
      - mt5_config:/config

  # 2. QUANT BOT CORE ENGINE
  quant_bot:
    build:
      context: .
      dockerfile: Dockerfile.linux
    container_name: quant_trading_engine_local
    restart: always
    depends_on:
      - mt5_bridge
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/London
      - PORT=8000  # ◄ Keeps bot communication off port 8501
    command: ["python3", "main.py"]
    volumes:
      - .:/app
      - ./logs:/app/logs

  # 3. STREAMLIT WEB DASHBOARD PACKAGE
  quant_ui_package:
    build:
      context: .
      dockerfile: Dockerfile.linux
    container_name: quant_trading_gui_package_local
    restart: always
    ports:
      - "8502:8501"  # ◄ Accessible via http://localhost:8502
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/London
    command: ["streamlit", "run", "webgui_dashboard/main_ui.py", "--server.port=8501", "--server.address=0.0.0.0"]
    volumes:
      - .:/app
      - ./logs:/app/logs

volumes:
  mt5_config:
