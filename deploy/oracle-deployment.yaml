apiVersion: apps/v1
kind: Deployment
metadata:
  name: mt5-bridge
  namespace: quant-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mt5-bridge
  template:
    metadata:
      labels:
        app: mt5-bridge
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64  # Pin Wine translation to x86_64 nodes only
      imagePullSecrets:
        - name: ocir-secret
      containers:
      - name: mt5-wine
        image: iad.ocir.io/idqcoec1tv4k/trading-system/metatrader5_vnc:latest
        imagePullPolicy: Always
        ports:
        - name: rpyc
          containerPort: 8001
        - name: vnc
          containerPort: 3000
        env:
        - name: CUSTOM_USER
          value: "admin"
        - name: PASSWORD
          value: "secure_vnc_telemetry_pass"
        - name: TZ
          value: "Europe/London"
---
apiVersion: v1
kind: Service
metadata:
  name: mt5-bridge
  namespace: quant-engine
spec:
  type: ClusterIP
  ports:
  - name: rpyc-port
    port: 8001
    targetPort: 8001
  - name: vnc-port
    port: 3000
    targetPort: 3000
  selector:
    app: mt5-bridge
---
# CONSOLIDATED QUANT_ENGINE RUNTIME (Bot + Dashboard UI together)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-runtime
  namespace: quant-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quant-runtime
  template:
    metadata:
      labels:
        app: quant-runtime
      annotations:
        # Dynamic cache-busting anchor updated for your deployment sync window
        quantengine.platform/build-id: "2026-07-21-v3"
    spec:
      # FIXED FOR MT5LINUX: Force the pod to settle explicitly on amd64 nodes to satisfy x86 binary locks
      nodeSelector:
        kubernetes.io/arch: amd64
      # Enforce permission profiles over your local storage channels automatically
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      imagePullSecrets:
        - name: ocir-secret
      containers:
      # CONTAINER A: THE CORE TRADING BOT
      - name: bot-engine
        image: iad.ocir.io/idqcoec1tv4k/trading-system/backend:v7-multiarch
        imagePullPolicy: Always
        command: ["/usr/local/bin/python3", "main.py"]  # ◄ FIXED: Direct script invoke removes loop conflicts
        args: []
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: TZ
          value: "Europe/London"
        - name: MT5_HOST
          value: "mt5-bridge.quant-engine.svc.cluster.local"
        - name: MT5_PORT
          value: "8001"
        - name: OANDA_ACCESS_TOKEN
          valueFrom:
            secretKeyRef: { name: quant-engine-secret, key: OANDA_ACCESS_TOKEN }
        - name: OANDA_ACCOUNT_ID
          valueFrom:
            secretKeyRef: { name: quant-engine-secret, key: OANDA_ACCOUNT_ID }
        - name: OANDA_API_URL
          valueFrom:
            secretKeyRef: { name: quant-engine-secret, key: OANDA_API_URL }
        - name: MT5_LOGIN
          valueFrom:
            secretKeyRef: { name: quant-engine-secret, key: MT5_LOGIN }
        - name: MT5_PASSWORD
          valueFrom:
            secretKeyRef: { name: quant-engine-secret, key: MT5_PASSWORD }
        - name: MT5_SERVER
          valueFrom:
            secretKeyRef: { name: quant-engine-secret, key: MT5_SERVER }
        - name: APP_ENV
          valueFrom:
            secretKeyRef: { name: quant-engine-secret, key: APP_ENV }
        - name: ALERT_WEBHOOK_URL
          valueFrom:
            secretKeyRef: { name: quant-engine-secret, key: ALERT_WEBHOOK_URL }
        volumeMounts:
        - name: local-shared-logs
          mountPath: /app/logs

      # CONTAINER B: THE STREAMLIT DASHBOARD (Sidecar)
      - name: dashboard-ui
        image: iad.ocir.io/idqcoec1tv4k/trading-system/backend:v7-multiarch
        imagePullPolicy: Always
        # ◄ Leverages default CMD execution safely from your multi-stage Dockerfile
        ports:
        - containerPort: 8501
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: TZ
          value: "Europe/London"
        - name: DASHBOARD_ADMIN_USER  # ◄ FIXED: Aligns perfectly with your script's os.getenv target key name
          valueFrom:
            secretKeyRef: { name: quant-engine-secret, key: DASHBOARD_USER }
        - name: DASHBOARD_ADMIN_PASS  # ◄ FIXED: Aligns perfectly with your script's os.getenv target key name
          valueFrom:
            secretKeyRef: { name: quant-engine-secret, key: DASHBOARD_PASS }
        volumeMounts:
        - name: local-shared-logs
          mountPath: /app/logs

      volumes:
      - name: local-shared-logs
        emptyDir: {}
---
# PUBLIC OCI LOAD BALANCER
apiVersion: v1
kind: Service
metadata:
  name: quant-ui-lb
  namespace: quant-engine
  annotations:
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8501
  selector:
    app: quant-runtime
