name: Deploy Quant Engine to OCI

on:
  push:
    branches:
      - main  # Triggers the pipeline whenever you push updates to main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out your repository code
        uses: actions/checkout@v4

      - name: Set up QEMU for emulation support
        uses: actions/差別/qemu-action@v3

      - name: Set up Docker Buildx
        uses: actions/docker/setup-buildx-action@v3

      # Log securely into your private Oracle Container Registry (OCIR)
      - name: Authenticate with OCI Registry
        uses: docker/login-action@v3
        with:
          registry: iad.ocir.io
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_PASSWORD }}

      # Compiles both architectures in one step and updates your registry tag
      - name: Compile and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.linux
          platforms: linux/amd64,linux/arm64
          push: true
          tags: iad.ocir.io/idqcoec1tv4k/trading-system/backend:v7-multiarch
          cache-from: type=gha
          cache-to: type=gha,mode=max
